server {
    listen 127.0.0.1:8443 ssl default_server;
    http2 on;
    server_name _;
    root /var/www/vpn-landing;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/moscow-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moscow-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_cache shared:VPNSTUB:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/vpn-landing.access.log;
    error_log /var/log/nginx/vpn-landing.error.log warn;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    # All CDNSYNC application requests are handled locally on moscow.
    location ~ ^/(?:_auth/(?:login|logout)|_contact/(?:submit|status)|service/overview)$ {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location ~ /\. {
        return 404;
    }
}
