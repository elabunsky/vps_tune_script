<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <meta name="robots" content="noindex">
  <title>404 — Страница не найдена · CDNSYNC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap');
    :root{--bg:#10131a;--text:#eef3ff;--muted:#aab5ca;--green:#66e394;--blue:#8fa9ff;--line:#2a3243}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse 60% 50% at 78% 0%,#1d3c3d88,transparent 72%),var(--bg);color:var(--text);font:16px/1.55 Manrope,system-ui,sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{width:100%;max-width:1180px;margin:auto;padding:0 24px}
    .nav{height:80px;display:flex;align-items:center;justify-content:space-between;margin:0 auto}
    .brand{font:600 18px Unbounded,sans-serif;letter-spacing:-.07em}
    .brand b{color:var(--green);font-weight:600}
    .navlink{font-size:14px;color:var(--muted)}
    .navlink:hover{color:var(--text)}
    main.wrap{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:64px;padding-top:64px;padding-bottom:80px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;border:1px solid #3a4d69;border-radius:99px;background:#15232a;padding:7px 11px;color:#b9f6cf;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #66e3941f}
    h1{font:600 clamp(34px,4.6vw,58px)/1.15 Unbounded,sans-serif;letter-spacing:-.045em;margin:24px 0 20px}
    h1 span{color:var(--green)}
    .lead{max-width:510px;color:var(--muted);font-size:18px;margin:0}
    .button{display:inline-block;margin-top:30px;border-radius:11px;background:var(--green);color:#07130b;font-size:14px;font-weight:800;padding:13px 19px;transition:transform .2s,box-shadow .2s}
    .button:hover{transform:translateY(-2px);box-shadow:0 9px 25px #66e39433}
    a:focus-visible{outline:2px solid var(--blue);outline-offset:6px}
    .art{position:relative;min-height:330px;display:grid;place-items:center}
    .art:before{content:"";position:absolute;inset:8% 0;border:1px solid #2e5957;border-radius:32px;background:linear-gradient(135deg,#172631,#101923);transform:rotate(-4deg)}
    .panel{position:relative;width:100%;padding:36px 24px;border:1px solid #344158;border-radius:24px;background:linear-gradient(145deg,#1b2230,#121a25);text-align:center;box-shadow:0 18px 40px #0004}
    .code{font:600 clamp(90px,12vw,146px)/1.2 Unbounded,sans-serif;letter-spacing:-.08em;color:var(--green);text-shadow:0 0 50px #66e39425;padding-right:.08em}
    .rule{width:80px;height:3px;margin:22px auto;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:4px}
    .caption{margin:0;color:var(--muted);font-size:14px}
    footer{border-top:1px solid var(--line);padding:26px 0;color:#71809b;font-size:13px}
    footer .wrap{display:flex;justify-content:space-between;gap:12px}
    @media(max-width:820px){main.wrap{grid-template-columns:1fr;gap:40px;max-width:640px;padding-top:40px;padding-bottom:56px}.art{min-height:270px}.panel{padding:24px}.code{font-size:100px}h1{font-size:clamp(32px,6vw,48px)}}
    @media(max-width:480px){.wrap{padding-left:17px;padding-right:17px}.nav{height:68px}.brand{font-size:15px}.lead{font-size:16px}footer .wrap{flex-direction:column;gap:4px}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}.button:hover{transform:none}}
  </style>
</head>
<body>
  <header class="wrap nav">
    <a class="brand" href="/" aria-label="CDNSYNC — на главную">cdn<b>sync</b></a>
    <a class="navlink" href="/#contact">Контакты</a>
  </header>
  <main class="wrap">
    <section aria-labelledby="page-title">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Ошибка 404</div>
      <h1 id="page-title">Эта страница<br><span>не найдена</span></h1>
      <p class="lead">Возможно, ссылка устарела или в адресе есть опечатка. Вернитесь на главную, чтобы продолжить работу.</p>
      <a class="button" href="/">Вернуться на главную <span aria-hidden="true">↗</span></a>
    </section>
    <div class="art" aria-hidden="true">
      <div class="panel"><div class="code">404</div><div class="rule"></div><p class="caption">Найдём нужное направление</p></div>
    </div>
  </main>
  <footer><div class="wrap"><span>CDNSYNC · Корпоративный обмен данными</span><span>Страница не найдена</span></div></footer>
</body>
</html>
