# Public :443 requests without a known SNI are routed here by the stream map.
# Replaces /etc/nginx/sites-enabled/wb-placeholder-8444.conf on msk.
server {
    listen 127.0.0.1:8444 ssl default_server;
    server_name 109.69.20.135 _;

    ssl_certificate /etc/letsencrypt/live/109.69.20.135/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/109.69.20.135/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Reuse the domain site's routes, assets and application handlers.
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name hophop.publicvm.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
