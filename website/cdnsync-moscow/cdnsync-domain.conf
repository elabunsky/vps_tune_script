server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name cdnsync.fedya-sbp.ru;
    root /var/www/vpn-landing;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/cdnsync.fedya-sbp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdnsync.fedya-sbp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_cache shared:VPNSTUB:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/vpn-landing.access.log;
    error_log /var/log/nginx/vpn-landing.error.log warn;
    # Moscow subscription pages: never cache HTML or generated profiles.
    location ~ ^/(?:happ|incy|add)\.html$ {
        try_files $uri =404;
        expires off;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location ~ ^/(?:happ|incy|config)\.txt$ {
        proxy_pass http://127.0.0.1:9075;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        expires off;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    # All CDNSYNC application requests are handled locally on moscow.
    location ~ ^/(?:_auth/(?:login|logout)|_contact/(?:submit|status)|service/overview)$ {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location ~ /\. {
        return 404;
    }
}
