# Prevent storage of all TXT responses, including subscription files.
map $uri $hophop_txt_cache_control {
    default "";
    ~*\.txt$ "no-store, no-cache, must-revalidate, max-age=0";
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name hophop.publicvm.com;

    ssl_certificate /etc/letsencrypt/live/hophop.publicvm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hophop.publicvm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/v2raytun-subscribe;
    index index.html;
    server_tokens off;
    add_header Cache-Control $hophop_txt_cache_control always;

    # --- белый список публично доступных файлов ---
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location = /service-zone.html {
        return 302 https://hophop.publicvm.com/service/overview;
    }
    location = /_auth/login {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
    location = /_auth/logout {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
    location = /_contact/submit {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /_contact/status {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /service/overview {
        proxy_pass http://127.0.0.1:9074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store" always;
    }
    location = /happ.html { }
    location = /add.html {
        return 302 https://hophop.publicvm.com/incy.html$is_args$args;
    }
    location = /incy.html {
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location = /fedya.html { }
    location = /happ.txt {
        include /etc/nginx/snippets/subgen-params.conf;
        fastcgi_param SUBGEN_FILE "happ";
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_hide_header Cache-Control;
        fastcgi_cache off;
    }
    location = /v2r.html { }
    location = /config.txt {
        include /etc/nginx/snippets/subgen-params.conf;
        fastcgi_param SUBGEN_FILE "incy";
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_hide_header Cache-Control;
        fastcgi_cache off;
    }

    location = /v2r.txt {
        include /etc/nginx/snippets/subgen-params.conf;
        fastcgi_param SUBGEN_FILE "v2r";
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_hide_header Cache-Control;
        fastcgi_cache off;
    }
    location = /incy.txt {
        include /etc/nginx/snippets/subgen-params.conf;
        fastcgi_param SUBGEN_FILE "incy";
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_hide_header Cache-Control;
        fastcgi_cache off;
    }
    location = /grpc.txt {
        default_type text/plain;
        try_files $uri =404;
        etag off;
        if_modified_since off;
    }
    location = /routing.txt {
        etag off;
        if_modified_since off;
    }
    location = /happ-import-guide.png { }
    location = /rats-hero.png { }

    # Статичный сайт мастерской Denisko.
    location = /denisko {
        return 301 /denisko/;
    }
    location ^~ /denisko/ {
        try_files $uri $uri/ =404;
    }

    # --- Hophop Agent (диалоговая прослойка) ---
    location /agent/ {
        proxy_pass http://127.0.0.1:9075;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- архив патченых xray-бинарей (anyuuid); токен в пути ---
    location ^~ /xray-patch/ {
        default_type application/octet-stream;
    }
    # --- всё остальное: 404 через страницу-заглушку ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        return 404;
    }
}
